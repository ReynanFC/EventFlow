server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_ORDER}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

logging:
  level:
    com.reynan.orderservice: DEBUG